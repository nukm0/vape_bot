<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барахолка - Личный кабинет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <h1>✨ Барахолка ✨</h1>
            </div>
        </div>

        <div class="main-content">
            <h2>👤 Личный кабинет</h2>
            
            <div class="login-box" id="loginBox">
                <h3>Вход в аккаунт</h3>
                <input type="text" id="loginName" placeholder="Ваше имя" class="input-field">
                <button onclick="login()" class="menu-btn">Войти</button>
            </div>

            <div class="profile-box" id="profileBox" style="display: none;">
                <h3>Привет, <span id="userName">---</span>!</h3>
                <p>📱 Мои объявления: 3</p>
                <p>⭐ Покупки: 5</p>
                <p>📝 Редактировать профиль</p>
                <button onclick="logout()" class="menu-btn" style="margin-top: 15px;">Выйти</button>
            </div>
        </div>

        <div class="bottom-menu">
            <a href="index.html" class="menu-btn">🏠 Главная</a>
            <a href="ads.html" class="menu-btn">📋 Объявления</a>
            <a href="faq.html" class="menu-btn">❓ FAQ</a>
        </div>
    </div>

    <script>
        function login() {
            let name = document.getElementById('loginName').value;
            if (name.trim() !== '') {
                localStorage.setItem('baraholka_user', name);
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('profileBox').style.display = 'block';
                document.getElementById('userName').innerText = name;
            } else {
                alert('Введите ваше имя');
            }
        }

        function logout() {
            localStorage.removeItem('baraholka_user');
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('profileBox').style.display = 'none';
            document.getElementById('loginName').value = '';
        }

        window.onload = function() {
            let savedUser = localStorage.getItem('baraholka_user');
            if (savedUser) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('profileBox').style.display = 'block';
                document.getElementById('userName').innerText = savedUser;
            }
        }
    </script>
</body>
</html>
